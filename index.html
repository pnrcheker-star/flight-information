<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNR Check</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:#000;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:#fff;
    padding:20px;
}

.header h2{
    margin:0;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
    opacity:0.8;
}

/* CONTENT */
.container{
    padding:15px;
}

/* FORM */
.form{
    background:#fff;
    border-radius:15px;
    padding:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    margin-top:-30px;
}

.form h3{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#2563eb,#1d4ed8);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* RESULT CARD */
.card{
    margin-top:20px;
    background:#f0fdf4;
    border-radius:15px;
    padding:15px;
    border:1px solid #bbf7d0;
    display:none;
}

/* STATUS */
.status{
    float:right;
    background:#22c55e;
    color:#000;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

/* ROUTE */
.route{
    text-align:center;
    margin:15px 0;
}

.route strong{
    font-size:18px;
}

/* GRID */
.grid{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

/* INFO BOX */
.info{
    margin-top:15px;
    background:#e0f2fe;
    padding:10px;
    border-radius:10px;
    font-size:13px;
}

/* ERROR */
.error{
    color:red;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    <h2>✈️ PNR CHECK</h2>
    <p>Cek Booking & E-Ticket Anda</p>
</div>

<div class="container">

    <div class="form">
        <h3>Cek PNR Booking</h3>

        <input id="pnr" placeholder="Kode Booking (PNR)">
        <input id="name" placeholder="Nama Belakang">

        <button onclick="cek()">🔍 Cek Booking</button>
    </div>

    <div class="error" id="error"></div>

    <div class="card" id="card"></div>

</div>

<script>

const db={
"AB12CD":{
name:"HARTONO",
airline:"Lion Air",
flight:"JT-782",
from:"Makassar (UPG)",
to:"Jakarta (CGK)",
depTime:"08:30",
arrTime:"10:45",
date:"25 Mei 2026",
class:"Economy",
status:"Confirmed"
}
};

function cek(){
    const pnr=document.getElementById("pnr").value.toUpperCase();
    const name=document.getElementById("name").value.toUpperCase();
    const card=document.getElementById("card");
    const error=document.getElementById("error");

    card.style.display="none";
    error.innerText="";

    if(!pnr||!name){
        error.innerText="Isi semua data";
        return;
    }

    const d=db[pnr];

    if(!d||d.name!==name){
        error.innerText="Booking tidak ditemukan";
        return;
    }

    card.style.display="block";

    card.innerHTML=`
        <div>
            <b>Booking Ditemukan</b>
            <span class="status">CONFIRMED</span>
        </div>

        <hr>

        <div><b>${d.airline}</b> (${d.flight})</div>

        <div class="route">
            <div>
                <strong>${d.from}</strong><br>
                ${d.depTime}
            </div>
            ✈️
            <div>
                <strong>${d.to}</strong><br>
                ${d.arrTime}
            </div>
        </div>

        <div class="grid">
            <div>Penumpang<br><b>${d.name}</b></div>
            <div>PNR<br><b>${pnr}</b></div>
        </div>

        <div class="grid">
            <div>Kelas<br><b>${d.class}</b></div>
            <div>Status<br><b>${d.status}</b></div>
        </div>

        <div class="info">
            Silakan tiba di bandara minimal 2 jam sebelum keberangkatan.
        </div>
    `;
}

</script>

</body>
</html>
