<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNR Checker</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#000;
    color:#fff;
}

/* HEADER */
.header {
    text-align:center;
    padding:15px;
    font-weight:bold;
}

/* BOX */
.box {
    margin:20px;
    background:#111;
    border-radius:25px;
    padding:20px;
}

/* INPUT */
input {
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    background:#222;
    color:#fff;
    margin-bottom:15px;
}

/* BUTTON */
button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-weight:bold;
}

/* RESULT */
.result {
    margin-top:20px;
    background:#1a1a1a;
    border-radius:20px;
    padding:15px;
    display:none;
}

/* GRID */
.row {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

/* TEXT */
.label {
    font-size:12px;
    color:#aaa;
}

.value {
    font-weight:bold;
}

/* ROUTE */
.route {
    text-align:center;
    margin:15px 0;
    font-size:18px;
}

/* STATUS */
.status {
    margin-top:15px;
    background:#00c853;
    color:#000;
    text-align:center;
    padding:10px;
    border-radius:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">Flight PNR Checker</div>

<div class="box">

<input type="text" id="pnr" placeholder="Masukkan kode PNR">

<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

<script>
const db = {
    "JHMAUZ": {
        nama:"Ny. Muliani",
        maskapai:"Batik Air",
        flight:"ID-6316",
        dari:"PNK",
        ke:"UPG",
        jam:"14:55 - 19:20",
        gate:"A2",
        seat:"18A",
        total:"Rp 1.739.900",
        status:"Confirmed"
    }
};

function cekPNR(){
    let input=document.getElementById("pnr").value.toUpperCase();
    let result=document.getElementById("result");

    if(db[input]){
        let d=db[input];

        result.innerHTML=`
        <div class="row">
            <div>
                <div class="label">Nama</div>
                <div class="value">${d.nama}</div>
            </div>
            <div>
                <div class="label">Maskapai</div>
                <div class="value">${d.maskapai}</div>
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>
                <div class="label">Flight</div>
                <div class="value">${d.flight}</div>
            </div>
            <div>
                <div class="label">Jam</div>
                <div class="value">${d.jam}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Gate</div>
                <div class="value">${d.gate}</div>
            </div>
            <div>
                <div class="label">Seat</div>
                <div class="value">${d.seat}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Total</div>
                <div class="value">${d.total}</div>
            </div>
        </div>

        <div class="status">✔ ${d.status}</div>
        `;

        result.style.display="block";
    } else {
        alert("PNR tidak ditemukan");
    }
}
</script>

</body>
</html>
