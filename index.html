<!DOCTYPE html>
<html>
<head>
  <title>Flight PNR Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    .container {
      margin: 30px;
      padding: 20px;
      background: #111;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255,0,0,0.2);
    }

    h1 {
      margin-bottom: 5px;
    }

    .desc {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .pnr-list {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .pnr-item {
      background: #222;
      padding: 10px;
      border-radius: 10px;
      flex: 1;
      margin: 5px;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #222;
      color: white;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      border: none;
      background: red;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .card {
      background: #111;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
    }

    .hidden { display: none; }

    .status {
      color: red;
      margin-top: 10px;
    }

    .loader {
      margin: 10px auto;
      border: 5px solid #333;
      border-top: 5px solid red;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>✈️ Flight PNR Checker</h1>
  <p class="desc">
    Cek status penerbangan Anda dengan mudah menggunakan kode PNR.
  </p>

  <!-- contoh PNR -->
  <div class="pnr-list">
    <div class="pnr-item" onclick="setPNR('GR123A')">GR123A</div>
    <div class="pnr-item" onclick="setPNR('AB456B')">AB456B</div>
    <div class="pnr-item" onclick="setPNR('ZX91LM')">ZX91LM</div>
  </div>

  <input type="text" id="pnr" placeholder="Masukkan kode PNR">
  <input type="text" id="nama" placeholder="Nama Belakang">

  <button onclick="cekPNR()">Cek Status</button>

  <!-- HASIL -->
  <div id="hasil" class="card hidden"></div>

</div>

<!-- PAGE PEMBAYARAN -->
<div id="payment" class="container hidden">
  <h2>💳 Pembayaran</h2>

  <div class="card">
    <p><b>BANK:</b> MNC</p>
    <p><b>A/n:</b> PT GOLDEN RAMA TRAVEL</p>
    <p><b>No Rek:</b> 2060-1000-6980-917</p>
    <p><b>Kode Bank:</b> 485</p>
  </div>

  <p>🙏 Terimakasih atas kepercayaan Anda memilih agen kami</p>
</div>

<audio id="sound">
  <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
</audio>

<script>

/* DATA PNR (EDIT DI SINI SAJA) */
const DATA = {
  pnr: "GR123A",
  nama: "SANTOSO"
};

/* klik PNR contoh */
function setPNR(code) {
  document.getElementById("pnr").value = code;
}

/* cek */
function cekPNR() {
  const pnr = document.getElementById("pnr").value.toUpperCase();
  const nama = document.getElementById("nama").value.toUpperCase();

  if (pnr !== DATA.pnr || nama !== DATA.nama) {
    alert("PNR tidak ditemukan!");
    return;
  }

  document.getElementById("hasil").classList.remove("hidden");

  document.getElementById("hasil").innerHTML = `
    <h3>Detail Booking</h3>
    <p><b>Nama:</b> ${DATA.nama}</p>
    <p><b>Rute:</b> CGK → DPS</p>
    <p><b>Maskapai:</b> Garuda Indonesia</p>
    <p><b>Waktu:</b> 10:00 - 12:00</p>
    <p><b>Class:</b> Economy</p>
    <p><b>Bagasi:</b> 20kg</p>
    <p><b>Konsumsi:</b> Snack</p>

    <h3 class="status">⏳ PENDING PAYMENT</h3>

    <div class="loader"></div>

    <p>Selesaikan dalam:</p>
    <h2 id="timer">30:00</h2>

    <button onclick="goPay()">Bayar Sekarang</button>
  `;

  document.getElementById("sound").play();
  startTimer(1800);
}

/* timer */
function startTimer(durasi) {
  let t = durasi;

  const i = setInterval(() => {
    let m = Math.floor(t / 60);
    let s = t % 60;

    s = s < 10 ? "0" + s : s;

    document.getElementById("timer").innerText = m + ":" + s;

    if (--t < 0) {
      clearInterval(i);
      document.getElementById("timer").innerText = "WAKTU HABIS";
    }
  }, 1000);
}

/* pindah ke pembayaran */
function goPay() {
  document.querySelector(".container").style.display = "none";
  document.getElementById("payment").classList.remove("hidden");
}

</script>

</body>
</html>
