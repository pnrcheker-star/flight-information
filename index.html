<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Kode PNR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.container {
    width: 350px;
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 15px;
}

/* INPUT */
input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #f1f1f1;
    margin-bottom: 15px;
    font-size: 16px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: red;
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

/* RESULT */
.result {
    margin-top: 20px;
    display: none;
    background: #f5f5f5;
    padding: 15px;
    border-radius: 12px;
}

.row {
    margin-bottom: 10px;
}

.label {
    font-size: 12px;
    color: gray;
}

.value {
    font-weight: bold;
}

/* STATUS */
.status {
    margin-top: 10px;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    background: green;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h2>🔍 Cek Kode PNR</h2>

    <input type="text" id="pnr" placeholder="Masukkan kode PNR">

    <button onclick="cekPNR()">Cek Status</button>

    <div class="result" id="result"></div>

</div>

<script>

/* DATABASE PNR */
const databasePNR = {
    "JHMAUZ": {
        nama: "Ny. Muliani",
        maskapai: "Batik Air",
        flight: "ID-6316",
        rute: "PNK → UPG",
        waktu: "14:55 - 19:20",
        status: "Confirmed"
    }
};

/* FUNCTION */
function cekPNR() {
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if (!input) {
        alert("Masukkan kode PNR!");
        return;
    }

    if (databasePNR[input]) {
        let data = databasePNR[input];

        result.innerHTML = `
            <div class="row">
                <div class="label">Nama</div>
                <div class="value">${data.nama}</div>
            </div>

            <div class="row">
                <div class="label">Maskapai</div>
                <div class="value">${data.maskapai}</div>
            </div>

            <div class="row">
                <div class="label">Flight</div>
                <div class="value">${data.flight}</div>
            </div>

            <div class="row">
                <div class="label">Rute</div>
                <div class="value">${data.rute}</div>
            </div>

            <div class="row">
                <div class="label">Waktu</div>
                <div class="value">${data.waktu}</div>
            </div>

            <div class="status">✔ ${data.status}</div>
        `;

        result.style.display = "block";

    } else {
        result.style.display = "none";
        alert("PNR tidak ditemukan!");
    }
}

</script>

</body>
</html>
