        {nama:"Gusti Nyoman Pusmiti", eticket:"086-9182736455", scoot:"12F", airasia:"15F"},

        {nama:"Ni Putu Rusmini", eticket:"086-9182736459", scoot:"13D", airasia:"16D"},
        {nama:"Gusti Ayu Putri Anjani", eticket:"086-9182736460", scoot:"13E", airasia:"16E"},

        {nama:"Ni Ketut Suasti", eticket:"086-9182736462", scoot:"14A", airasia:"17A"}
    ]
}

};


// FUNCTION
function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        // LIST PENUMPANG
        let paxList = "";
        if(d.passengers){
            d.passengers.forEach((p,i)=>{
                paxList += `
                <div class="row">
                    <div>
                        <div class="label">${i+1}. ${p.nama}</div>
                        <div class="value">ETKT: ${p.eticket}</div>
                    </div>
                    <div>
                        <div class="label">Seat</div>
                        <div class="value">${p.scoot} / ${p.airasia}</div>
                    </div>
                </div>
                `;
            });
        }

        result.innerHTML = `
        
        <div class="row">
            <div>
                <div class="label">Nama</div>
                <div class="value">${d.nama}</div>
            </div>
            <div>
                <div class="label">Maskapai</div>
                <div class="value">${d.maskapai}</div>
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>
                <div class="label">Flight</div>
                <div class="value">${d.flight}</div>
            </div>
            <div>
                <div class="label">Jadwal</div>
                <div class="value">${d.jam}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Gate</div>
                <div class="value">${d.gate}</div>
            </div>
            <div>
                <div class="label">Seat</div>
                <div class="value">${d.seat}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Boarding</div>
                <div class="value">${d.boarding}</div>
            </div>
            <div>
                <div class="label">Total</div>
                <div class="value">${d.total}</div>
            </div>
        </div>

        <div class="info">
        Class: ${d.class} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}
        </div>

        <div class="status">${d.status}</div>

        <div class="timer" id="timer"></div>

        <div class="info">
        Segera lakukan pembayaran sebelum batas waktu habis
        </div>

        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${input}">
        </div>

        <div style="margin-top:20px">
            <div class="label">Daftar Penumpang</div>
            ${paxList}
        </div>
        `;

        result.style.display="block";

        startTimer(d.expired);

    } else {
        alert("PNR tidak ditemukan");
    }
}


// TIMER
function startTimer(duration) {
    let timer = duration;
    const display = document.getElementById("timer");

    const interval = setInterval(() => {
        let minutes = Math.floor(timer / 60);
        let seconds = timer % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.innerHTML = `⏳ Sisa waktu: ${minutes}:${seconds}`;

        if (--timer < 0) {
            clearInterval(interval);
            display.innerHTML = "❌ Waktu habis, harga tidak berlaku";
        }
    }, 1000);
}


// AUTO SCAN
const urlParams = new URLSearchParams(window.location.search);
const pnr = urlParams.get('pnr');

if (pnr) {
    document.getElementById("pnr").value = pnr;
    setTimeout(() => cekPNR(), 500);
}

</script>
