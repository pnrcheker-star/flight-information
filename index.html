<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

.box {
    margin:20px;
    padding:20px;
    border-radius:25px;
    background:#111;
    box-shadow:0 0 30px rgba(255,0,0,0.2);
}

.title {
    text-align:center;
    font-size:22px;
}

input, button {
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    margin-top:10px;
}

button {
    background:red;
    color:white;
    font-weight:bold;
}

.result {
    margin-top:20px;
    display:none;
    background:#1a1a1a;
    padding:20px;
    border-radius:20px;
}

.passenger {
    background:#222;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
}

.timer {
    margin-top:10px;
    text-align:center;
    color:#ff3b30;
}

.status {
    background:#FFD600;
    color:#000;
    padding:10px;
    border-radius:10px;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<input type="text" id="pnr" placeholder="Masukkan kode PNR">
<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

<script>

// DATABASE BARU (ARRAY PENUMPANG)
const db = {

"GIA7KP": {
    maskapai:"Garuda Indonesia",
    flight:"GA 223 / GA 224",
    dari:"Solo (SOC)",
    ke:"Denpasar (DPS)",
    jam:"08:00 - 10:40",
    total:"Rp 1.300.001 / pax",
    status:"Menunggu Pembayaran",
    deadlineHour:9,

    penumpang:[
        {nama:"Rudyanto Gunadi", title:"MR", seat:"12A"},
        {nama:"Sylvia Suyani", title:"MRS", seat:"12B"}
    ]
},

"JHMAUZ": {
    maskapai:"Batik Air",
    flight:"ID-6316",
    dari:"Pontianak (PNK)",
    ke:"Makassar (UPG)",
    jam:"14:55 - 19:20",
    total:"Rp 3.479.800",
    status:"Menunggu Pembayaran",
    deadlineHour:9,

    penumpang:[
        {nama:"Muliani", title:"MRS", seat:"18A"},
        {nama:"Budi Santoso", title:"MR", seat:"18B"}
    ]
}

};


// FUNCTION
function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        let penumpangHTML = "";
        d.penumpang.forEach(p => {
            penumpangHTML += `
            <div class="passenger">
                ${p.nama} (${p.title}) - Seat ${p.seat}
            </div>`;
        });

        result.innerHTML = `
        <div><b>${d.maskapai}</b></div>
        <div>${d.dari} ✈ ${d.ke}</div>
        <div>${d.flight}</div>
        <div>${d.jam}</div>

        <h3>Penumpang:</h3>
        ${penumpangHTML}

        <div class="status">${d.status}</div>
        <div class="timer" id="timer"></div>
        <div style="text-align:center;margin-top:10px;">
        Total: ${d.total}
        </div>
        `;

        result.style.display="block";
        startTimer(d.deadlineHour);

    } else {
        alert("PNR tidak ditemukan");
    }
}


// TIMER
function startTimer(hour){
    const display = document.getElementById("timer");

    const interval = setInterval(() => {
        let now = new Date();
        let target = new Date();
        target.setHours(hour,0,0,0);

        let diff = (target - now)/1000;

        if(diff <= 0){
            clearInterval(interval);
            display.innerHTML = "❌ Waktu habis";
            return;
        }

        let m = Math.floor(diff/60);
        let s = Math.floor(diff%60);

        display.innerHTML = `⏳ Sisa waktu: ${m}:${s<10?"0"+s:s}`;
    },1000);
}

</script>

</body>
</html>
