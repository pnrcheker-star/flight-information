<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNR Checker</title><style>
body {
    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

.box {
    margin:20px;
    padding:20px;
    border-radius:20px;
    background:#111;
}

.title {
    text-align:center;
    font-size:20px;
    margin-bottom:10px;
}

input, button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
}

input { background:#222; color:#fff; }
button { background:red; color:#fff; }

.result {
    display:none;
    margin-top:15px;
    background:#1a1a1a;
    padding:15px;
    border-radius:15px;
}

.row {
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.label { color:#aaa; font-size:12px; }
.value { font-weight:bold; }

.status {
    margin-top:10px;
    padding:10px;
    text-align:center;
    border-radius:10px;
    background:#00c853;
    color:#000;
}
</style></head><body><div class="box">
<div class="title">✈️ PNR Checker</div><input type="text" id="pnr" placeholder="Masukkan PNR">
<button onclick="cek()">Cek</button><div class="result" id="result"></div>
</div><script>

const db = {

"4E5CY5": {
    nama:"Andika Fendi Pratama",
    maskapai:"Sriwijaya Air",
    flight:"SJ562 / SJ6982",
    rute:"SUB → UPG → TTE",
    jam:"20:05 - 12:55",
    total:"Rp 2.231.800",
    status:"✔ Issued"
}

};

function cek(){
    let pnr = document.getElementById("pnr").value.toUpperCase();
    let r = document.getElementById("result");

    if(db[pnr]){
        let d = db[pnr];

        r.innerHTML = `
        <div class="row"><div class="label">Nama</div><div class="value">${d.nama}</div></div>
        <div class="row"><div class="label">Maskapai</div><div class="value">${d.maskapai}</div></div>
        <div class="row"><div class="label">Flight</div><div class="value">${d.flight}</div></div>
        <div class="row"><div class="label">Rute</div><div class="value">${d.rute}</div></div>
        <div class="row"><div class="label">Jam</div><div class="value">${d.jam}</div></div>
        <div class="row"><div class="label">Total</div><div class="value">${d.total}</div></div>

        <div class="status">${d.status}</div>
        `;

        r.style.display="block";

    } else {
        alert("PNR tidak ditemukan");
    }
}

// auto isi dari URL
let url = new URLSearchParams(window.location.search);
let p = url.get("pnr");
if(p){
    document.getElementById("pnr").value = p;
    cek();
}

</script></body>
</html>
