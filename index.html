<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

.box {
    margin:20px;
    padding:20px;
    border-radius:25px;
    background:#111;
    box-shadow:0 0 30px rgba(255,0,0,0.2);
}

.title {
    text-align:center;
    font-size:22px;
    margin-bottom:10px;
}

.desc {
    text-align:center;
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
}

input {
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    background:#222;
    color:#fff;
    margin-bottom:15px;
}

button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.result {
    margin-top:20px;
    display:none;
    background:#1a1a1a;
    border-radius:20px;
    padding:20px;
}

.row {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.label {
    font-size:12px;
    color:#aaa;
}

.value {
    font-weight:bold;
}

.route {
    text-align:center;
    margin:15px 0;
    font-size:18px;
}

.status {
    margin-top:15px;
    background:#FFD600;
    color:#000;
    text-align:center;
    padding:12px;
    border-radius:20px;
    font-weight:bold;
}

.timer {
    margin-top:10px;
    text-align:center;
    color:#ff3b30;
    font-size:14px;
}

.info {
    text-align:center;
    font-size:13px;
    color:#aaa;
}

.qr {
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<p class="desc">
Cek status penerbangan Anda dengan mudah menggunakan kode PNR. 
Data yang ditampilkan merupakan data resmi dari sistem penerbangan.
</p>

<input type="text" id="pnr" placeholder="Masukkan kode PNR">
<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

<script>

// DATABASE (TIDAK MENGUBAH STRUKTUR)
const db = {

"JHMAUZ": {
    nama:"Ny. Muliani",
    maskapai:"Batik Air",
    flight:"ID-6316",
    dari:"Pontianak (PNK)",
    ke:"Makassar (UPG)",
    jam:"14:55 - 19:20",
    boarding:"14:25",
    gate:"A2",
    seat:"18A",
    total:"Rp 1.739.900",
    status:"Pending Payment",
    expired:1800,
    class:"Economy",
    bagasi:"20kg",
    konsumsi:"Snack"
},

"4E5CY5": {
    nama:"Andika Fendi Pratama",
    maskapai:"Sriwijaya Air",
    flight:"SJ562 / SJ6982",
    dari:"Surabaya (SUB)",
    ke:"Ternate (TTE)",
    jam:"20:05 - 12:55",
    boarding:"19:30",
    gate:"-",
    seat:"-",
    total:"Rp 2.231.800",
    status:"Pending Payment",
    expired:1800,
    class:"Economy",
    bagasi:"20kg",
    konsumsi:"Snack"
}

};

function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        result.innerHTML = `
        <div class="row">
            <div>
                <div class="label">Nama</div>
                <div class="value">${d.nama}</div>
            </div>
            <div>
                <div class="label">Maskapai</div>
                <div class="value">${d.maskapai}</div>
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>
                <div class="label">Flight</div>
                <div class="value">${d.flight}</div>
            </div>
            <div>
                <div class="label">Jam</div>
                <div class="value">${d.jam}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Gate</div>
                <div class="value">${d.gate}</div>
            </div>
            <div>
                <div class="label">Seat</div>
                <div class="value">${d.seat}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Boarding</div>
                <div class="value">${d.boarding}</div>
            </div>
            <div>
                <div class="label">Total</div>
                <div class="value">${d.total}</div>
            </div>
        </div>

        <div class="info">
        Class: ${d.class} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}
        </div>

        <div class="status">⏳ ${d.status}</div>

        <div class="timer" id="timer"></div>

        <div class="info">
        Segera lakukan pembayaran sebelum harga berubah
        </div>

        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${input}">
        </div>
        `;

        result.style.display="block";

        startTimer(d.expired);

    } else {
        alert("PNR tidak ditemukan");
    }
}

function startTimer(duration) {
    let timer = duration;
    const display = document.getElementById("timer");

    const interval = setInterval(() => {
        let minutes = Math.floor(timer / 60);
        let seconds = timer % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.innerHTML = `⏳ Sisa waktu: ${minutes}:${seconds}`;

        if (--timer < 0) {
            clearInterval(interval);
            display.innerHTML = "❌ Harga telah berubah, silakan pesan ulang";
        }
    }, 1000);
}

// AUTO SCAN
const urlParams = new URLSearchParams(window.location.search);
const pnr = urlParams.get('pnr');

if (pnr) {
    document.getElementById("pnr").value = pnr;
    setTimeout(() => cekPNR(), 500);
}

</script>

</body>
</html>
