<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000 !important;
    color: #fff;
}

/* HEADER */
.header {
    text-align: center;
    padding: 15px;
    background: #000;
    font-weight: bold;
}

/* BOX */
.box {
    margin: 20px;
    background: #111;
    border-radius: 20px;
    padding: 20px;
}

/* TITLE */
.title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #222;
    color: #fff;
    margin-bottom: 15px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: red;
    color: white;
    font-weight: bold;
}

/* RESULT */
.result {
    margin-top: 20px;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 15px;
    display: none;
}

/* TEXT */
.label {
    font-size: 12px;
    color: #aaa;
}

.value {
    font-weight: bold;
}

/* STATUS */
.status {
    margin-top: 10px;
    background: #00c853;
    color: #000;
    text-align: center;
    padding: 10px;
    border-radius: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">Flight PNR Checker</div>

<div class="box">

    <div class="title">✈️ Flight PNR Checker</div>

    <input type="text" id="pnr" placeholder="Masukkan kode PNR">

    <button onclick="cekPNR()">Cek Status</button>

    <div class="result" id="result"></div>

</div>

<script>
const databasePNR = {
    "JHMAUZ": {
        nama: "Ny. Muliani",
        maskapai: "Batik Air",
        flight: "ID-6316",
        jam: "14:55 - 19:20",
        dari: "PNK (Pontianak)",
        ke: "UPG (Makassar)",
        kelas: "Ekonomi",
        bagasi: "20 kg",
        total: "Rp 1.739.900",
        status: "Confirmed"
    }
};

function cekPNR() {
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if (databasePNR[input]) {
        let d = databasePNR[input];

        result.innerHTML = `
            <p><b>${d.nama}</b></p>
            <p>${d.maskapai}</p>
            <p>${d.flight}</p>
            <p>${d.dari} → ${d.ke}</p>
            <p>${d.jam}</p>
            <p>${d.total}</p>
            <div class="status">${d.status}</div>
        `;

        result.style.display = "block";
    } else {
        alert("PNR tidak ditemukan!");
    }
}
</script>

</body>
</html>
