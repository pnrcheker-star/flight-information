<script>

// DATABASE
const db = {
"JHMAUZ": {
    nama:"Ny. Muliani",
    maskapai:"Batik Air",
    flight:"ID-6316",
    dari:"Pontianak (PNK)",
    ke:"Makassar (UPG)",
    jam:"14:55 - 19:20",
    boarding:"14:25",
    gate:"A2",
    seat:"18A",
    total:"Rp 1.739.900",
    status:"Pending Payment", // 🔥 UBAH DI SINI
    expired:1800, // 30 menit
    class:"Economy",
    bagasi:"20kg",
    konsumsi:"Snack"
}
};

// FUNCTION
function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        result.innerHTML = `
        
        <div class="row">
            <div>
                <div class="label">Nama</div>
                <div class="value">${d.nama}</div>
            </div>
            <div>
                <div class="label">Maskapai</div>
                <div class="value">${d.maskapai}</div>
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>
                <div class="label">Flight</div>
                <div class="value">${d.flight}</div>
            </div>
            <div>
                <div class="label">Jam</div>
                <div class="value">${d.jam}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Gate</div>
                <div class="value">${d.gate}</div>
            </div>
            <div>
                <div class="label">Seat</div>
                <div class="value">${d.seat}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Boarding</div>
                <div class="value">${d.boarding}</div>
            </div>
            <div>
                <div class="label">Total</div>
                <div class="value">${d.total}</div>
            </div>
        </div>

        <div style="margin-top:10px;font-size:13px;color:#aaa;">
        Class: ${d.class} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}
        </div>

        <div class="status">⏳ ${d.status}</div>

        ${d.status === "Pending Payment" ? `
        <div id="timer" style="margin-top:10px;text-align:center;color:#ff3b30;font-size:14px;"></div>
        <div style="text-align:center;font-size:13px;color:#aaa;">
        Segera lakukan pembayaran sebelum harga berubah
        </div>
        ` : ""}

        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${input}">
        </div>

        `;

        result.style.display="block";

        // 🔥 JALANKAN TIMER
        if(d.status === "Pending Payment"){
            startTimer(d.expired);
        }

    } else {
        alert("PNR tidak ditemukan");
    }
}


// TIMER FUNCTION
function startTimer(duration) {
    let timer = duration;
    const display = document.getElementById("timer");

    const interval = setInterval(() => {
        let minutes = Math.floor(timer / 60);
        let seconds = timer % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        if(display){
            display.innerHTML = `⏳ Sisa waktu: ${minutes}:${seconds}`;
        }

        if (--timer < 0) {
            clearInterval(interval);
            if(display){
                display.innerHTML = "❌ Harga telah berubah, silakan pesan ulang";
            }
        }
    }, 1000);
}


// AUTO DARI SCAN
const urlParams = new URLSearchParams(window.location.search);
const pnr = urlParams.get('pnr');

if (pnr) {
    document.getElementById("pnr").value = pnr;
    setTimeout(() => cekPNR(), 500);
}

</script>
