<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #000;
    color: #fff;
}

/* CONTAINER */
.box {
    margin: 20px;
    padding: 20px;
    background: linear-gradient(145deg,#0a0a0a,#1a1a1a);
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
}

/* TITLE */
.title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 10px;
}

/* DESC */
.desc {
    text-align: center;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 20px;
}

/* PNR LIST */
.pnr-list {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.pnr-item {
    flex:1;
    padding:10px;
    background:#222;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
}

/* INPUT */
input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #222;
    color: #fff;
    margin-bottom: 15px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: red;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

/* RESULT */
.result {
    display:none;
    margin-top:20px;
    background:#111;
    padding:15px;
    border-radius:20px;
}

/* ROW */
.row {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

/* ROUTE */
.route {
    text-align:center;
    font-size:18px;
    margin:15px 0;
}

/* STATUS */
.status {
    margin-top:15px;
    padding:10px;
    border-radius:20px;
    text-align:center;
    font-weight:bold;
}

.green {background:#00c853;color:#000;}
.yellow {background:#ffd600;color:#000;}
.blue {background:#00b0ff;color:#000;}
.red {background:#ff1744;color:#fff;}

/* QR */
.qr {
    width:80px;
    height:80px;
    background:#fff;
    border-radius:10px;
    margin-top:10px;
}

/* EXTRA */
.extra {
    margin-top:10px;
    font-size:13px;
    color:#ccc;
}
</style>
</head>

<body>

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<div class="desc">
Cek status penerbangan Anda dengan mudah menggunakan kode PNR.
</div>

<div class="pnr-list">
    <div class="pnr-item" onclick="setPNR('JHMAUZ')">JHMAUZ</div>
    <div class="pnr-item" onclick="setPNR('KP243X')">KP243X</div>
    <div class="pnr-item" onclick="setPNR('ZX91LM')">ZX91LM</div>
</div>

<input id="pnr" placeholder="Masukkan kode PNR">

<button onclick="cekPNR()">Cek Status</button>

<div id="result" class="result"></div>

</div>

<script>
const db = {
    "JHMAUZ":{
        nama:"Ny. Muliani",
        maskapai:"Batik Air",
        dari:"Pontianak (PNK)",
        ke:"Makassar (UPG)",
        flight:"ID-6316",
        jam:"14:55 - 19:20",
        gate:"A2",
        seat:"18A",
        boarding:"14:25",
        bagasi:"20kg",
        kelas:"Economy",
        konsumsi:"Snack",
        total:"Rp 1.739.900",
        status:"Check-in Open",
        warna:"yellow"
    },
    "KP243X":{
        nama:"Budi Santoso",
        maskapai:"Garuda Indonesia",
        dari:"Jakarta (CGK)",
        ke:"Bali (DPS)",
        flight:"GA-204",
        jam:"10:00 - 13:00",
        gate:"B1",
        seat:"12A",
        boarding:"09:20",
        bagasi:"25kg",
        kelas:"Business",
        konsumsi:"Full Meal",
        total:"Rp 3.200.000",
        status:"Confirmed",
        warna:"green"
    }
};

function setPNR(kode){
    document.getElementById("pnr").value = kode;
}

function cekPNR(){
    let pnr = document.getElementById("pnr").value.toUpperCase();
    let r = document.getElementById("result");

    if(db[pnr]){
        let d = db[pnr];

        r.innerHTML = `
        <div class="row">
            <div>
                <small>Nama</small><br>${d.nama}
            </div>
            <div>
                <small>Maskapai</small><br>${d.maskapai}
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>Flight<br>${d.flight}</div>
            <div>Jam<br>${d.jam}</div>
        </div>

        <div class="row">
            <div>Gate<br>${d.gate}</div>
            <div>Seat<br>${d.seat}</div>
        </div>

        <div class="row">
            <div>Boarding<br>${d.boarding}</div>
            <div>Total<br>${d.total}</div>
        </div>

        <div class="extra">
            Class: ${d.kelas} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}
        </div>

        <div class="status ${d.warna}">
            ${d.status}
        </div>

        <div class="qr"></div>
        `;

        r.style.display="block";
    } else {
        alert("PNR tidak ditemukan");
    }
}
</script>

</body>
</html>
