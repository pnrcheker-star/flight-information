<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

/* BOX */
.box {
    margin:20px;
    padding:20px;
    border-radius:25px;
    background:#111;
    box-shadow:0 0 30px rgba(255,0,0,0.2);
}

.title {
    text-align:center;
    font-size:22px;
    margin-bottom:10px;
}

.desc {
    text-align:center;
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
}

input {
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    background:#222;
    color:#fff;
    margin-bottom:15px;
}

button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-weight:bold;
    font-size:16px;
}

/* RESULT */
.result {
    margin-top:20px;
    display:none;
    background:#1a1a1a;
    border-radius:20px;
    padding:20px;
}

/* GRID */
.row {
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.label {
    font-size:12px;
    color:#aaa;
}

.value {
    font-weight:bold;
}

/* ROUTE */
.route {
    text-align:center;
    margin:15px 0;
    font-size:18px;
}

/* STATUS */
.status {
    margin-top:15px;
    background:#FFD600;
    color:#000;
    text-align:center;
    padding:12px;
    border-radius:20px;
    font-weight:bold;
}

/* QR */
.qr {
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<p class="desc">
Cek status penerbangan Anda dengan mudah menggunakan kode PNR
</p>

<input type="text" id="pnr" placeholder="Masukkan kode PNR">
<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

<script>

// DATABASE
const db = {
"JHMAUZ": {
    nama:"Ny. Muliani",
    maskapai:"Batik Air",
    flight:"ID-6316",
    dari:"Pontianak (PNK)",
    ke:"Makassar (UPG)",
    jam:"14:55 - 19:20",
    boarding:"14:25",
    gate:"A2",
    seat:"18A",
    total:"Rp 1.739.900",
    status:"Check-in Open",
    class:"Economy",
    bagasi:"20kg",
    konsumsi:"Snack"
}
};

// FUNCTION
function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        result.innerHTML = `
        
        <div class="row">
            <div>
                <div class="label">Nama</div>
                <div class="value">${d.nama}</div>
            </div>
            <div>
                <div class="label">Maskapai</div>
                <div class="value">${d.maskapai}</div>
            </div>
        </div>

        <div class="route">
            ${d.dari} ✈ ${d.ke}
        </div>

        <div class="row">
            <div>
                <div class="label">Flight</div>
                <div class="value">${d.flight}</div>
            </div>
            <div>
                <div class="label">Jam</div>
                <div class="value">${d.jam}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Gate</div>
                <div class="value">${d.gate}</div>
            </div>
            <div>
                <div class="label">Seat</div>
                <div class="value">${d.seat}</div>
            </div>
        </div>

        <div class="row">
            <div>
                <div class="label">Boarding</div>
                <div class="value">${d.boarding}</div>
            </div>
            <div>
                <div class="label">Total</div>
                <div class="value">${d.total}</div>
            </div>
        </div>

        <div style="margin-top:10px;font-size:13px;color:#aaa;">
        Class: ${d.class} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}
        </div>

        <div class="status">✔ ${d.status}</div>

        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${input}">
        </div>

        `;

        result.style.display="block";

    } else {
        alert("PNR tidak ditemukan");
    }
}


// AUTO DARI SCAN
const urlParams = new URLSearchParams(window.location.search);
const pnr = urlParams.get('pnr');

if (pnr) {
    document.getElementById("pnr").value = pnr;
    setTimeout(() => cekPNR(), 500);
}

</script>

</body>
</html>
