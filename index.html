<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #5f7fa6, #dfe7f1);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    width: 360px;
    background: #f5f7fa;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
    font-weight: bold;
}
input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
    background: #e9edf2;
}
button {
    width: 100%;
    padding: 15px;
    background: red;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}
.card {
    margin-top: 20px;
    background: #e1e5ea;
    border-radius: 15px;
    padding: 15px;
    display: none;
}
.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}
.label {
    font-size: 13px;
    color: #555;
}
.value {
    font-weight: bold;
}
.status {
    margin-top: 15px;
    background: #2ecc71;
    color: white;
    padding: 10px;
    border-radius: 20px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">✈️ Flight PNR Checker</div>

    <input type="text" id="pnr" placeholder="Masukkan Kode PNR">

    <button onclick="cekPNR()">Cek Status</button>

    <div class="card" id="result"></div>
</div>

<script>
// 🔹 Database PNR (1 data saja)
const databasePNR = {
    "JHMAUZ": {
        nama: "Ny. Muliani",
        maskapai: "Batik Air",
        flight: "ID-6316",
        jam: "14:55 - 19:20",
        dari: "PNK (Pontianak)",
        ke: "UPG (Makassar)",
        kelas: "Ekonomi",
        bagasi: "20 kg",
        total: "Rp 1.739.900",
        status: "Confirmed"
    }
};

function cekPNR() {
    const pnrInput = document.getElementById("pnr").value.toUpperCase();
    const result = document.getElementById("result");

    if (!pnrInput) {
        alert("Masukkan kode PNR!");
        return;
    }

    if (databasePNR[pnrInput]) {
        const data = databasePNR[pnrInput];

        result.innerHTML = `
            <div class="row">
                <div>
                    <div class="label">Nama</div>
                    <div class="value">${data.nama}</div>
                </div>
                <div>
                    <div class="label">Maskapai</div>
                    <div class="value">${data.maskapai}</div>
                </div>
            </div>

            <div class="row">
                <div>
                    <div class="label">Flight</div>
                    <div class="value">${data.flight}</div>
                </div>
                <div>
                    <div class="label">Jam</div>
                    <div class="value">${data.jam}</div>
                </div>
            </div>

            <div class="row">
                <div>
                    <div class="label">Dari</div>
                    <div class="value">${data.dari}</div>
                </div>
                <div>
                    <div class="label">Ke</div>
                    <div class="value">${data.ke}</div>
                </div>
            </div>

            <div class="row">
                <div>
                    <div class="label">Kelas</div>
                    <div class="value">${data.kelas}</div>
                </div>
                <div>
                    <div class="label">Bagasi</div>
                    <div class="value">${data.bagasi}</div>
                </div>
            </div>

            <div class="row">
                <div>
                    <div class="label">Total</div>
                    <div class="value">${data.total}</div>
                </div>
            </div>

            <div class="status">✔ ${data.status}</div>
        `;

        result.style.display = "block";
    } else {
        result.style.display = "none";
        alert("PNR tidak ditemukan!");
    }
}
</script>

</body>
</html>
