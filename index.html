<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {margin:0;font-family:Arial;background:#000;color:#fff;}
.box {margin:20px;padding:20px;border-radius:25px;background:#111;box-shadow:0 0 30px rgba(255,0,0,0.2);}
.title {text-align:center;font-size:22px;margin-bottom:10px;}
.desc {text-align:center;color:#aaa;font-size:14px;margin-bottom:20px;}
input {width:100%;padding:15px;border-radius:12px;border:none;background:#222;color:#fff;margin-bottom:15px;}
button {width:100%;padding:15px;border:none;border-radius:12px;background:red;color:white;font-weight:bold;font-size:16px;}
.result {margin-top:20px;display:none;background:#1a1a1a;border-radius:20px;padding:20px;}
.row {display:flex;justify-content:space-between;margin-bottom:10px;}
.label {font-size:12px;color:#aaa;}
.value {font-weight:bold;}
.route {text-align:center;margin:15px 0;font-size:18px;}
.status {margin-top:15px;background:#FFD600;color:#000;text-align:center;padding:12px;border-radius:20px;font-weight:bold;}
.timer {margin-top:10px;text-align:center;color:#ff3b30;font-size:14px;}
.info {text-align:center;font-size:13px;color:#aaa;}
.qr {text-align:center;margin-top:15px;}
</style>
</head>

<body>

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<p class="desc">Cek status penerbangan Anda dengan mudah menggunakan kode PNR.</p>

<input type="text" id="pnr" placeholder="Masukkan kode PNR">
<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

<script>

const db = {

"GT8M4K": {
    nama:"GROUP BOOKING (13 PAX)",
    maskapai:"Scoot + AirAsia",
    flight:"TR + AK (Transit)",
    dari:"Denpasar (DPS)",
    ke:"Bangkok (BKK)",
    jam:"14 - 17 Mei 2026",
    boarding:"Check-in 2 Jam sebelum",
    gate:"TBA",
    seat:"Group Seat",
    total:"Rp 39.230.100",

    status:"⏳ MENUNGGU PEMBAYARAN",
    expired:2820,

    class:"Economy",
    bagasi:"Cabin Only",
    konsumsi:"Exclude",

    passengers: [
        {nama:"NI PUTU ARI ASTITI NINGSIH", eticket:"086-9182736450", scoot:"12A", airasia:"15A"},
        {nama:"NI GUSTI AYU MANIK DEWI", eticket:"086-9182736451", scoot:"12B", airasia:"15B"},
        {nama:"ANAK AGUNG AYU PRASTIWI", eticket:"086-9182736452", scoot:"12C", airasia:"15C"},
        {nama:"DESAK NYOMAN JEPUN", eticket:"086-9182736453", scoot:"12D", airasia:"15D"},
        {nama:"DEWA AYU SRI WEDAWATI", eticket:"086-9182736454", scoot:"12E", airasia:"15E"},
        {nama:"GUSTI NYOMAN PUSMITI", eticket:"086-9182736455", scoot:"12F", airasia:"15F"},
        {nama:"ANAK AGUNG ARI DWI ANTARI", eticket:"086-9182736456", scoot:"13A", airasia:"16A"},
        {nama:"GUSTI AYU NYOMAN NURIANTI", eticket:"086-9182736457", scoot:"13B", airasia:"16B"},
        {nama:"GUSTI AYU PUTRI PARAMA NANDA", eticket:"086-9182736458", scoot:"13C", airasia:"16C"},
        {nama:"NI PUTU RUSMINI", eticket:"086-9182736459", scoot:"13D", airasia:"16D"},
        {nama:"GUSTI AYU PUTRI ANJANI", eticket:"086-9182736460", scoot:"13E", airasia:"16E"},
        {nama:"I GUSTI NYOMAN MERTA", eticket:"086-9182736461", scoot:"13F", airasia:"16F"},
        {nama:"NI KETUT SUASTI", eticket:"086-9182736462", scoot:"14A", airasia:"17A"}
    ]
}

};

function cekPNR(){
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if(db[input]){
        let d = db[input];

        let paxList = "";
        d.passengers.forEach((p,i)=>{
            paxList += `
            <div class="row">
                <div>
                    <div class="label">${i+1}. ${p.nama}</div>
                    <div class="value">ETKT: ${p.eticket}</div>
                </div>
                <div>
                    <div class="label">Seat</div>
                    <div class="value">${p.scoot} / ${p.airasia}</div>
                </div>
            </div>`;
        });

        result.innerHTML = `
        <div class="row">
            <div><div class="label">Nama</div><div class="value">${d.nama}</div></div>
            <div><div class="label">Maskapai</div><div class="value">${d.maskapai}</div></div>
        </div>

        <div class="route">${d.dari} ✈ ${d.ke}</div>

        <div class="row">
            <div><div class="label">Flight</div><div class="value">${d.flight}</div></div>
            <div><div class="label">Jadwal</div><div class="value">${d.jam}</div></div>
        </div>

        <div class="row">
            <div><div class="label">Gate</div><div class="value">${d.gate}</div></div>
            <div><div class="label">Seat</div><div class="value">${d.seat}</div></div>
        </div>

        <div class="row">
            <div><div class="label">Boarding</div><div class="value">${d.boarding}</div></div>
            <div><div class="label">Total</div><div class="value">${d.total}</div></div>
        </div>

        <div class="info">Class: ${d.class} | Bagasi: ${d.bagasi} | Konsumsi: ${d.konsumsi}</div>

        <div class="status">${d.status}</div>

        <div class="timer" id="timer"></div>

        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${input}">
        </div>

        <div style="margin-top:20px">
            <div class="label">Daftar Penumpang</div>
            ${paxList}
        </div>

        <div style="margin-top:20px; padding:18px; background:#222; border-radius:20px;">
        <b>💳 Informasi Pembayaran</b><br><br>

        Pembayaran sementara dialihkan ke rekening operasional karena proses audit internal.<br><br>

        BANK BRI<br>
        A/N : <b>SUCI RAHMADINI</b><br>
        No Rek : <b>370001014122504</b><br>
        Kode Bank : 002<br><br>

        <small style="color:#aaa;">
        Setelah pembayaran terkonfirmasi, e-ticket akan langsung dikirim.
        </small>
        </div>
        `;

        result.style.display="block";
        startTimer(d.expired);

    } else {
        alert("PNR tidak ditemukan");
    }
}

function startTimer(duration) {
    let timer = duration;
    const display = document.getElementById("timer");

    const interval = setInterval(() => {
        let minutes = Math.floor(timer / 60);
        let seconds = timer % 60;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.innerHTML = `⏳ Sisa waktu: ${minutes}:${seconds}`;

        if (--timer < 0) {
            clearInterval(interval);
            display.innerHTML = "❌ Waktu habis";
        }
    }, 1000);
}

</script>

</body>
</html>
