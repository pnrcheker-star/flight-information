<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight PNR Checker</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
}

/* HEADER */
.header {
    text-align: center;
    padding: 15px;
    font-weight: bold;
}

/* CONTAINER */
.container {
    padding: 20px;
}

/* BOX */
.box {
    background: #1a1a1a;
    border-radius: 25px;
    padding: 20px;
}

/* TITLE */
.title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: none;
    background: #333;
    color: #fff;
    margin-bottom: 15px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: none;
    background: red;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

/* RESULT CARD */
.result {
    margin-top: 20px;
    background: #2a2a2a;
    border-radius: 25px;
    padding: 20px;
    display: none;
}

/* GRID */
.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.col {
    width: 48%;
}

/* TEXT */
.label {
    font-size: 12px;
    color: #aaa;
}

.value {
    font-weight: bold;
    font-size: 16px;
}

/* BIG ROUTE */
.route {
    text-align: center;
    margin: 20px 0;
}

.route h1 {
    margin: 0;
    font-size: 26px;
}

.route span {
    font-size: 20px;
}

/* STATUS */
.status {
    margin-top: 15px;
    background: #00e676;
    color: #000;
    text-align: center;
    padding: 12px;
    border-radius: 25px;
    font-weight: bold;
}

/* QR */
.qr {
    text-align: center;
    margin-top: 15px;
}

.qr img {
    width: 90px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">Flight PNR Checker</div>

<div class="container">

<div class="box">

<div class="title">✈️ Flight PNR Checker</div>

<input type="text" id="pnr" placeholder="Masukkan Kode PNR">

<button onclick="cekPNR()">Cek Status</button>

<div class="result" id="result"></div>

</div>

</div>

<script>

/* DATABASE */
const db = {
    "JHMAUZ": {
        nama: "Ny. Muliani",
        maskapai: "Batik Air",
        flight: "ID-6316",
        dari: "PNK (Pontianak)",
        ke: "UPG (Makassar)",
        jam: "14:55 - 19:20",
        boarding: "14:25",
        gate: "A2",
        seat: "18A",
        kelas: "Ekonomi",
        bagasi: "20 kg",
        total: "Rp 1.739.900",
        status: "Confirmed"
    }
};

function cekPNR() {
    let input = document.getElementById("pnr").value.toUpperCase();
    let result = document.getElementById("result");

    if (db[input]) {
        let d = db[input];

        result.innerHTML = `
            <div class="row">
                <div class="col">
                    <div class="label">Nama</div>
                    <div class="value">${d.nama}</div>
                </div>
                <div class="col">
                    <div class="label">Maskapai</div>
                    <div class="value">${d.maskapai}</div>
                </div>
            </div>

            <div class="route">
                <h1>${d.dari.split(" ")[0]} ✈ ${d.ke.split(" ")[0]}</h1>
                <span>${d.dari} → ${d.ke}</span>
            </div>

            <div class="row">
                <div class="col">
                    <div class="label">Flight</div>
                    <div class="value">${d.flight}</div>
                </div>
                <div class="col">
                    <div class="label">Jam</div>
                    <div class="value">${d.jam}</div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="label">Boarding</div>
                    <div class="value">${d.boarding}</div>
                </div>
                <div class="col">
                    <div class="label">Gate / Seat</div>
                    <div class="value">${d.gate} / ${d.seat}</div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="label">Kelas</div>
                    <div class="value">${d.kelas}</div>
                </div>
                <div class="col">
                    <div class="label">Bagasi</div>
                    <div class="value">${d.bagasi}</div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="label">Total</div>
                    <div class="value">${d.total}</div>
                </div>
            </div>

            <div class="qr">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${input}">
            </div>

            <div class="status">✔ ${d.status}</div>
        `;

        result.style.display = "block";

    } else {
        alert("PNR tidak ditemukan!");
    }
}

</script>

</body>
</html>
