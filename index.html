<script>
let time=600, timerInterval;

// FIX ambil element (WAJIB)
const pnrInput = document.getElementById("pnr");
const loading = document.getElementById("loading");
const ticket = document.getElementById("ticket");

const airline = document.getElementById("airline");
const pnrOut = document.getElementById("pnrOut");
const rute = document.getElementById("rute");
const flight = document.getElementById("flight");
const gate = document.getElementById("gate");

const tanggal = document.getElementById("tanggal");
const depart = document.getElementById("depart");
const arrive = document.getElementById("arrive");

const passengers = document.getElementById("passengers");
const countdown = document.getElementById("countdown");
const status = document.getElementById("status");
const date = document.getElementById("date");

const clickSound = document.getElementById("clickSound");

// DATA
const airlines=["Garuda Indonesia","Lion Air","Batik Air","Citilink"];
const routes=["Jakarta → Bali","Makassar → Jakarta","Surabaya → Lombok","Kendari → Makassar"];

/* SPLASH FIX */
window.onload=()=>{
let splash=document.getElementById("splash");
setTimeout(()=>{
splash.classList.add("splash-hide");
setTimeout(()=>splash.style.display="none",600);
},2200);
};

/* SOUND FIX */
function beep(){
try{
let ctx=new(window.AudioContext||window.webkitAudioContext)();
let osc=ctx.createOscillator();
osc.frequency.value=800;
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.1);
}catch(e){}
}

function playSound(){
beep();
clickSound.currentTime=0;
clickSound.play().catch(()=>{});
}

/* VALIDASI */
function validPNR(p){ return /^[A-Z0-9]{6}$/.test(p); }

/* RANDOM */
function randomTime(){
let h=Math.floor(Math.random()*24);
let m=Math.floor(Math.random()*60);
return (h<10?"0"+h:h)+":"+(m<10?"0"+m:m);
}

function genPassengers(){
let n=["Budi","Andi","Rina","Sari","Dewi"];
let c=Math.floor(Math.random()*3)+1, html="";
for(let i=0;i<c;i++){
html+=`<div class="passenger">${n[Math.floor(Math.random()*n.length)]} - Seat ${Math.floor(Math.random()*30)}A</div>`;
}
return html;
}

function generateData(pnr){
return{
pnr,
airline:airlines[Math.floor(Math.random()*airlines.length)],
rute:routes[Math.floor(Math.random()*routes.length)],
flight:"ID-"+Math.floor(Math.random()*900+100),
gate:"G"+Math.floor(Math.random()*10),
tanggal:new Date().toLocaleDateString("id-ID"),
depart:randomTime(),
arrive:randomTime()
};
}

/* TIMER FIX */
function startTimer(){
clearInterval(timerInterval);

timerInterval=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;

countdown.innerText=m+":"+(s<10?"0"+s:s);
time--;

if(time<400){
status.innerText="ISSUED";
status.style.color="green";
}

if(time<200){
status.innerText="CHECK-IN";
status.style.color="blue";
}

if(time<0){
clearInterval(timerInterval);
countdown.innerText="EXPIRED";
status.innerText="EXPIRED";
status.style.color="red";
}
},1000);
}

/* MAIN FIX */
function cekPNR(){
let pnr=pnrInput.value.toUpperCase().trim();

if(!validPNR(pnr)){
alert("PNR harus 6 karakter (huruf/angka)");
return;
}

playSound(); // 🔊 sound klik

loading.style.display="block";
ticket.classList.remove("show");

setTimeout(()=>{
loading.style.display="none";

let d=generateData(pnr);

airline.innerText=d.airline;
pnrOut.innerText=d.pnr;
rute.innerText=d.rute;
flight.innerText=d.flight;
gate.innerText=d.gate;

tanggal.innerText=d.tanggal;
depart.innerText=d.depart;
arrive.innerText=d.arrive;

date.innerText=new Date().toLocaleString("id-ID");

passengers.innerHTML=genPassengers();

ticket.style.display="block";
setTimeout(()=>ticket.classList.add("show"),50);

time=600;
status.innerText="BOOKED";
status.style.color="orange";

startTimer();

},1200);
}

/* WA */
function kirimWA(){
if(!pnrOut.innerText){
alert("Cek PNR dulu");
return;
}

let text=`✈️ SkyPNR

PNR: ${pnrOut.innerText}
Rute: ${rute.innerText}
Flight: ${flight.innerText}
Tanggal: ${tanggal.innerText}
Berangkat: ${depart.innerText}
Tiba: ${arrive.innerText}
Status: ${status.innerText}`;

window.open("https://wa.me/?text="+encodeURIComponent(text));
}
</script>
