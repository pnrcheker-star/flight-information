<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNR Check</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:#fff;
    padding:20px;
}

.header h2{
    margin:0;
}

/* CONTENT */
.container{
    padding:15px;
}

/* FORM */
.form{
    background:#fff;
    border-radius:15px;
    padding:15px;
    margin-top:-30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
}

/* RESULT */
.card{
    margin-top:20px;
    background:#f0fdf4;
    border-radius:15px;
    padding:15px;
    border:1px solid #bbf7d0;
    display:none;
}

/* STATUS */
.status{
    float:right;
    background:#22c55e;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

/* ROUTE */
.route{
    text-align:center;
    margin:15px 0;
}

.route strong{
    font-size:18px;
}

/* GRID */
.grid{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

/* ERROR */
.error{
    text-align:center;
    color:red;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    <h2>✈️ PNR CHECK</h2>
</div>

<div class="container">

    <div class="form">
        <input id="pnr" placeholder="Masukkan Kode Booking">
        <button onclick="cek()">Cek</button>
    </div>

    <div class="error" id="error"></div>

    <div class="card" id="card"></div>

</div>

<script>

const db={
"SJTUW3":{
name:"HELENA REKE",
airline:"SUPER AIR JET",
flight:"UI-797",
from:"KUPANG (KOE)",
to:"Jakarta (CGK)",
dep:"10:55",
arr:"12:50",
date:"17 Mei 2026",
seat:"12A",
gate:"A3",
boarding:"10:00",
status:"CONFIRMED"
},
"ZX98YU":{
name:"SAPUTRA",
airline:"Citilink",
flight:"QG-110",
from:"Makassar (UPG)",
to:"Surabaya (SUB)",
dep:"14:00",
arr:"15:30",
date:"27 Mei 2026",
seat:"7C",
gate:"B1",
boarding:"13:20",
status:"CONFIRMED"
}
};

function cek(){
    const pnr=document.getElementById("pnr").value.toUpperCase();
    const card=document.getElementById("card");
    const error=document.getElementById("error");

    card.style.display="none";
    error.innerText="";

    if(!pnr){
        error.innerText="Masukkan kode PNR";
        return;
    }

    const d=db[pnr];

    if(!d){
        error.innerText="PNR tidak ditemukan";
        return;
    }

    card.style.display="block";

    card.innerHTML=`
        <div>
            <b>${d.airline} - ${d.flight}</b>
            <span class="status">${d.status}</span>
        </div>

        <hr>

        <div class="route">
            <div><strong>${d.from}</strong><br>${d.dep}</div>
            ✈️
            <div><strong>${d.to}</strong><br>${d.arr}</div>
        </div>

        <div class="grid">
            <div>Nama<br><b>${d.name}</b></div>
            <div>PNR<br><b>${pnr}</b></div>
        </div>

        <div class="grid">
            <div>Tanggal<br><b>${d.date}</b></div>
            <div>Seat<br><b>${d.seat}</b></div>
        </div>

        <div class="grid">
            <div>Gate<br><b>${d.gate}</b></div>
            <div>Boarding<br><b>${d.boarding}</b></div>
        </div>
    `;
}

</script>

</body>
</html>
