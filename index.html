<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Ticket Viewer</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#020617;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CONTAINER */
.container{
    width:400px;
    background:#020617;
    padding:20px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:#fff;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* TICKET */
.ticket{
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
    display:none;
    box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

/* HEADER */
.ticket-header{
    background:#1e293b;
    padding:15px;
}

.airline{
    font-size:18px;
    font-weight:bold;
}

.flight{
    font-size:13px;
    color:#94a3b8;
}

/* BODY */
.ticket-body{
    background:#f8fafc;
    color:#000;
    padding:18px;
}

/* ROUTE */
.route{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.city{
    font-size:18px;
    font-weight:bold;
}

.code{
    font-size:13px;
    color:#555;
}

/* LINE */
.line{
    height:1px;
    background:#ddd;
    margin:15px 0;
}

/* INFO GRID */
.grid{
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

/* FOOTER */
.ticket-footer{
    background:#e2e8f0;
    padding:12px;
    text-align:center;
}

/* BARCODE */
.barcode{
    font-family:monospace;
    font-size:22px;
    letter-spacing:3px;
}

/* STATUS */
.status{
    float:right;
    background:#22c55e;
    padding:4px 10px;
    border-radius:15px;
    font-size:11px;
    font-weight:bold;
}

/* ERROR */
.error{
    color:red;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

    <input id="pnr" placeholder="Kode Booking (PNR)">
    <input id="name" placeholder="Nama Belakang">

    <button onclick="cek()">Cek Tiket</button>

    <div class="error" id="error"></div>

    <div class="ticket" id="ticket"></div>

</div>

<script>

const db={
"AB12CD":{
name:"HARTONO",
airline:"LION AIR",
flight:"JT-782",
fromCity:"Makassar",
fromCode:"UPG",
toCity:"Jakarta",
toCode:"CGK",
date:"25 Mei 2026",
time:"08:30",
boarding:"08:00",
gate:"A12",
seat:"12A"
},
"ZX98YU":{
name:"SAPUTRA",
airline:"CITILINK",
flight:"QG-110",
fromCity:"Makassar",
fromCode:"UPG",
toCity:"Surabaya",
toCode:"SUB",
date:"27 Mei 2026",
time:"14:00",
boarding:"13:20",
gate:"B3",
seat:"7C"
}
};

function randomBarcode(){
    return "||||| |||| ||||| ||||";
}

function cek(){
    const pnr=document.getElementById("pnr").value.toUpperCase();
    const name=document.getElementById("name").value.toUpperCase();
    const t=document.getElementById("ticket");
    const e=document.getElementById("error");

    t.style.display="none";
    e.innerText="";

    if(!pnr||!name){
        e.innerText="Isi semua data";
        return;
    }

    const d=db[pnr];

    if(!d||d.name!==name){
        e.innerText="PNR tidak ditemukan";
        return;
    }

    t.style.display="block";

    t.innerHTML=`
    <div class="ticket-header">
        <span class="airline">${d.airline}</span>
        <span class="status">CONFIRMED</span><br>
        <span class="flight">${d.flight}</span>
    </div>

    <div class="ticket-body">

        <div class="route">
            <div>
                <div class="city">${d.fromCity}</div>
                <div class="code">${d.fromCode}</div>
            </div>

            ✈️

            <div>
                <div class="city">${d.toCity}</div>
                <div class="code">${d.toCode}</div>
            </div>
        </div>

        <div class="line"></div>

        <div class="grid">
            <div><b>Passenger</b><br>${d.name}</div>
            <div><b>PNR</b><br>${pnr}</div>
        </div>

        <div class="grid">
            <div><b>Date</b><br>${d.date}</div>
            <div><b>Time</b><br>${d.time}</div>
        </div>

        <div class="grid">
            <div><b>Boarding</b><br>${d.boarding}</div>
            <div><b>Gate</b><br>${d.gate}</div>
        </div>

        <div class="grid">
            <div><b>Seat</b><br>${d.seat}</div>
            <div><b>Class</b><br>Economy</div>
        </div>

    </div>

    <div class="ticket-footer">
        <div class="barcode">${randomBarcode()}</div>
        <div style="font-size:11px;">SCAN AT GATE</div>
    </div>
    `;
}

</script>

</body>
  </html>
