<!DOCTYPE html>
<html>
<head>
  <title>Cek PNR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background: #f4f6f9;
    }

    /* ✈️ animasi pesawat */
    .plane {
      position: fixed;
      top: 20%;
      left: -60px;
      font-size: 32px;
      animation: fly 4s linear forwards;
    }

    @keyframes fly {
      0% { left: -60px; }
      100% { left: 110%; }
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .hidden { display: none; }

    .status { color: red; }

    /* loader */
    .loader {
      margin: 10px auto;
      border: 5px solid #eee;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="plane">✈️</div>

<!-- ================= PAGE 1 ================= -->
<div id="page1">

  <h3>🔍 Cek Status Booking</h3>
  <p>Masukkan kode booking (PNR) dan nama belakang</p>

  <input type="text" id="pnr" placeholder="PNR (contoh: GR123A)">
  <input type="text" id="lastname" placeholder="Nama Belakang">

  <button onclick="cekPNR()">Cek</button>

  <div id="hasil" class="card hidden"></div>

</div>

<!-- ================= PAGE 2 ================= -->
<div id="page2" class="hidden">

  <h2>💳 Pembayaran</h2>

  <div class="card">
    <p><b>BANK:</b> MNC</p>
    <p><b>A/n:</b> PT GOLDEN RAMA TRAVEL</p>
    <p><b>No Rek:</b> 2060-1000-6980-917</p>
    <p><b>Kode Bank:</b> 485</p>
  </div>

  <p>🙏 Terimakasih atas kepercayaan Anda memilih agen kami</p>

</div>

<audio id="sound">
  <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
</audio>

<script>
/* ================= DATA PNR (MUDAH EDIT) ================= */
const DATA_PNR = {
  pnr: "GR123A",
  nama: "SANTOSO",
  rute: "CGK → DPS",
  maskapai: "Garuda Indonesia",
  waktu: "10:00 - 12:00",
  class: "Economy",
  bagasi: "20kg",
  konsumsi: "Snack"
};

/* ================= CEK PNR ================= */
function cekPNR() {
  const inputPNR = document.getElementById("pnr").value.toUpperCase();
  const inputNama = document.getElementById("lastname").value.toUpperCase();

  if (!inputPNR || !inputNama) {
    alert("Isi data dulu!");
    return;
  }

  if (inputPNR !== DATA_PNR.pnr || inputNama !== DATA_PNR.nama) {
    alert("PNR tidak ditemukan!");
    return;
  }

  const hasil = document.getElementById("hasil");
  hasil.classList.remove("hidden");

  hasil.innerHTML = `
    <h4>Detail Booking</h4>

    <p><b>Nama:</b> ${DATA_PNR.nama}</p>
    <p><b>Rute:</b> ${DATA_PNR.rute}</p>
    <p><b>Maskapai:</b> ${DATA_PNR.maskapai}</p>
    <p><b>Waktu:</b> ${DATA_PNR.waktu}</p>
    <p><b>Class:</b> ${DATA_PNR.class}</p>
    <p><b>Bagasi:</b> ${DATA_PNR.bagasi}</p>
    <p><b>Konsumsi:</b> ${DATA_PNR.konsumsi}</p>

    <h3 class="status">⏳ PENDING PAYMENT</h3>

    <div class="loader"></div>

    <p>Segera lakukan pembayaran dalam:</p>
    <h2 id="timer">30:00</h2>

    <button onclick="goPayment()">Bayar Sekarang</button>
  `;

  document.getElementById("sound").play();
  startTimer(1800);
}

/* ================= TIMER ================= */
function startTimer(duration) {
  let time = duration;

  const interval = setInterval(() => {
    let m = Math.floor(time / 60);
    let s = time % 60;

    s = s < 10 ? "0" + s : s;

    document.getElementById("timer").innerText = m + ":" + s;

    if (--time < 0) {
      clearInterval(interval);
      document.getElementById("timer").innerText = "WAKTU HABIS";
    }
  }, 1000);
}

/* ================= NAVIGASI ================= */
function goPayment() {
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
}
</script>

</body>
</html>
