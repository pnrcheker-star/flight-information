<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR PNR</title>

<!-- Library QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #000;
    color: #fff;
    text-align: center;
}

.container {
    padding: 20px;
}

h1 {
    margin-top: 20px;
}

#reader {
    width: 100%;
    max-width: 300px;
    margin: 20px auto;
    border-radius: 20px;
    overflow: hidden;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #111;
    border-radius: 15px;
}

a {
    color: #00ffcc;
}
</style>
</head>

<body>

<div class="container">
    <h1>📷 Scan Kode QR</h1>
    <p>Arahkan kamera ke QR tiket Anda</p>

    <div id="reader"></div>

    <div class="result" id="result">
        Hasil scan akan muncul di sini
    </div>
</div>

<script>
function onScanSuccess(decodedText, decodedResult) {
    document.getElementById("result").innerHTML =
        "✅ Hasil: <br><b>" + decodedText + "</b>";

    // contoh kalau mau redirect ke halaman PNR
    if(decodedText.length === 6){
        window.location.href = "index.html?pnr=" + decodedText;
    }
}

function onScanError(errorMessage) {
    // biarin saja (error scan normal)
}

let scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
);

scanner.render(onScanSuccess, onScanError);
</script>

</body>
</html>
