<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Tiket</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial;
    text-align:center;
}

h2 {
    margin-top:20px;
}

#reader {
    width:300px;
    margin:30px auto;
    border-radius:20px;
    overflow:hidden;
}

.info {
    font-size:14px;
    color:#aaa;
}
</style>
</head>

<body>

<h2>📷 Scan Tiket</h2>
<p class="info">Arahkan kamera ke QR tiket</p>

<div id="reader"></div>

<script>
function onScanSuccess(decodedText) {
    // pindah ke halaman utama + isi PNR
    window.location.href = "index.html?pnr=" + decodedText;
}

function onScanError(error) {
    // optional (biarin kosong juga boleh)
}

const scanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: 250
});

scanner.render(onScanSuccess, onScanError);
</script>

</body>
</html>
